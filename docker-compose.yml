version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: my_project_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_project_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # Uncomment this section if you want to run the Next.js app in Docker too
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: my_project_app
  #   restart: always
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URL: "mysql://myuser:mypassword@mysql:3306/my_project_db"
  #   depends_on:
  #     - mysql
  #   networks:
  #     - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
